name: Keep Supabase Alive

on:
  schedule:
    # 每天台灣時間 08:00 與 20:00 各執行一次
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      # 1. 檢出程式碼（加入此步驟才能進行 git 操作）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 原本喚醒 Supabase 的步驟
      - name: Wake up Supabase
        run: |
          # 這裡使用你真實存在的資料表，確保產生有效活動
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/kv_store_3cb85d06?select=*" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      # 3. 新增：自動提交空白 Commit，保持 Repo 活躍狀態
      - name: Keep repository active
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep repository active [skip ci]"
          git push
